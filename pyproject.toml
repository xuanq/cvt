[project]
name = "cvt"
version = "0.2.0"
description = "统一封装多种文档转换引擎的命令行和 Python API"
readme = "README.md"
authors = [
    { name = "xuanqi", email = "xuanqiraphael@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.14.0",
    "pymupdf4llm>=1.27.2.2",
    "requests>=2.33.1",
]

[project.scripts]
cvt = "cvt:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
